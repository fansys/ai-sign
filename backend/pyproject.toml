[project]
name = "sign-server"
version = "0.1.0"
description = "AI 工具自动签到服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
