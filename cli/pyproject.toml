[project]
name = "sign-cli"
version = "0.1.0"
description = "提取本机 AI 工具登录态(ticket)并提交到签到服务"
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]  # 仅 Qoder 本机解密用

[project.scripts]
sign-cli = "signcli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
